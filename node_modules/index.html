
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage Student Records Easily</p>
    </header>

    <main class="container">

        <section class="stats">
            <div class="stat-card">
                <h3>Total Students</h3>
                <h2 id="totalStudents">0</h2>
            </div>
        </section>

        <section class="form-section">
            <h2 id="formTitle">Add New Student</h2>

            <form id="studentForm">

                <input type="hidden" id="studentId">

                <div class="form-grid">

                    <div>
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Enter full name" required>
                    </div>

                    <div>
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Enter email" required>
                    </div>

                    <div>
                        <label>Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter phone number">
                    </div>

                    <div>
                        <label>Department</label>
                        <select id="department">
                            <option value="">Select Department</option>
                            <option value="Biotechnology">Biotechnology</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Civil">Civil</option>
                        </select>
                    </div>

                    <div>
                        <label>Academic Year</label>
                        <select id="year">
                            <option value="">Select Year</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                        </select>
                    </div>

                    <div>
                        <label>Gender</label>
                        <select id="gender">
                            <option value="">Select Gender</option>
                            <option value="Female">Female</option>
                            <option value="Male">Male</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                </div>

                <button type="submit" id="submitBtn">Add Student</button>
                <button type="button" id="cancelBtn" class="cancel-btn" hidden>
                    Cancel Edit
                </button>

            </form>
        </section>

        <section class="table-section">

            <h2>Student Records</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by name, email or department..."
            >

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Gender</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                    </tbody>
                </table>
            </div>

            <p id="emptyMessage">No students added yet.</p>

        </section>

    </main>

    <footer>
        <p>Student Management System | 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
